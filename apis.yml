aid: donna
name: Donna
description: >-
  Donna is a voice-first, always-on AI assistant purpose-built for field sales teams, developed by
  Dealside and sold at askdonna.com. It automates the administrative work that surrounds selling in
  the field: preparing pre-meeting briefings, capturing and structuring meeting notes for both
  in-person and virtual calls, drafting follow-up emails and quotes, and writing captured data back
  into the CRM automatically. Donna integrates with the enterprise systems field reps already use,
  including Salesforce, HubSpot, Microsoft Dynamics 365, SAP, Outlook, and Google Calendar, and
  reports outcomes such as a 75% reduction in admin time, a 20% lift in sales conversion, and roughly
  10x higher CRM adoption. Founded in 2024 by Nicolas Christiaen (CEO), Jonas Deprez (COO), and Xander
  Berkein (CTO), the company operates from Ghent, London, and New York and is backed by Point Nine,
  Frontline Ventures, Fortino Capital, Pitchdrive, and others. The platform is ISO 27001-certified and
  compliant with SOC 2, GDPR, and CCPA, with data encrypted in transit and never used to train AI
  models. Donna is a SaaS product and does not currently publish a public developer API, SDK, or MCP
  server surface; its only machine-readable public artifact is an llms.txt at askdonna.com, which
  describes the product for AI agents but exposes no callable operations.
